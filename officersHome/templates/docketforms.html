{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Docket Registration | The Watchtower</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet"/>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    {% tailwind_css %}
</head>

<body>
    <div class="min-h-screen py-14 px-36 bg-gray-900 bg-cover bg-center">
        <div class="max-w-3xl mx-auto p-6 bg-gray-100 rounded-lg shadow-md">

            <div class="justify-center items-center mb-6 flex flex-row">
            <img class="h-12 mr-4" src="{% static 'staticfiles/admin/img/download.png' %}" alt="Your Company">
            <h2 class="text-3xl text-gray-800 font-bold uppercase">DOCKET REGISTRATION FORMS</h2>
            </div>
        
            <!-- Case Information Section -->
            <div class="mb-8">
                <h3 class="text-xl font-semibold text-gray-700 mb-4">Case Information</h3>
                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Case Number/ID</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-1 focus:ring-blue-500 focus:border-blue-500" placeholder="Auto-generated" disabled>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Case Title/Description</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-1 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter case title">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Date & Time of Incident</label>
                        <input type="datetime-local" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-1 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Date & Time of Report</label>
                        <input type="datetime-local" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-1 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
            </div>
        
            <!-- Reporting Officer Information Section -->
            <div>
                
            </div>

            <div class="mb-8">
                <h3 class="text-xl font-semibold text-gray-700 mb-4">Reporting Officer</h3>
                <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Officer Name</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-1 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter officer name">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Badge/ID Number</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-1 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter badge/ID number">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Rank</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter rank">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Station/Post</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-1 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter station or post">
                    </div>
                </div>
            </div>
        
            <!-- Incident Details Section -->
            <div class="mb-8">
                <h3 class="text-xl font-semibold text-gray-700 mb-4">Incident Details</h3>
                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Location of Incident</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter incident location">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Type of Incident</label>
                        <select class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
                            <option>Theft</option>
                            <option>Assault</option>
                            <option>Traffic Accident</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700">Nature of the Incident</label>
                        <textarea class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" rows="4" placeholder="Provide a detailed description"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Evidence Collected</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="List evidence items">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Witnesses</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="List witness names">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700">Injuries or Damages</label>
                        <textarea class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" rows="3" placeholder="Describe injuries or damages"></textarea>
                    </div>
                </div>
            </div>
        
            <!-- Involved Parties Section -->
            <div class="mb-8">
                <h3 class="text-xl font-semibold text-gray-700 mb-4">Involved Parties</h3>
                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <!-- Complainant Information -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Complainant Name</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter complainant name">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Complainant Contact Information</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter contact details">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700">Relationship to Incident</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Describe relationship to incident">
                    </div>
                    <!-- Suspect Information -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Suspect Name</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter suspect name">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Physical Description</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Describe suspect's appearance">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700">Criminal Record</label>
                        <textarea class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" rows="3" placeholder="List previous criminal record (if any)"></textarea>
                    </div>
                    <!-- Victim Information -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Victim Name</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter victim name">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Victim Contact Information</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter contact details">
                    </div>
                </div>
            </div>
        
            <!-- Legal and Procedural Information Section -->
            <div class="mb-8">
                <h3 class="text-xl font-semibold text-gray-700 mb-4">Legal and Procedural Information</h3>
                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Charges Filed</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="List charges">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Legal Actions Taken</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Describe legal actions">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Assigned Investigator</label>
                        <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Investigator name">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Case Status</label>
                        <select class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
                            <option>Open</option>
                            <option>Under Investigation</option>
                            <option>Closed</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700">Follow-Up Required</label>
                        <textarea class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" rows="3" placeholder="Notes on follow-up actions"></textarea>
                    </div>
                </div>
            </div>
        
            <!-- Additional Notes Section -->
            <div class="mb-8">
                <h3 class="text-xl font-semibold text-gray-700 mb-4">Additional Notes</h3>
                <textarea class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" rows="4" placeholder="Enter additional observations or comments"></textarea>
            </div>
        
            <!-- Attachments Section -->
            <div class="mb-8">
                <h3 class="text-xl font-semibold text-gray-700 mb-4">Attachments</h3>
                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Photos</label>
                        <input type="file" multiple class="mt-1 block w-full text-gray-500 p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Documents</label>
                        <input type="file" multiple class="mt-1 block w-full text-gray-500 p-2">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700">Videos</label>
                        <input type="file" multiple class="mt-1 block w-full text-gray-500 p-2">
                    </div>
                </div>
            </div>
        
            <!-- Submit Button -->
            <div class="flex justify-end">
                <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded-md shadow-sm">Submit Case</button>
            </div>
        </div>
        
    </div>
</body>
</html>
